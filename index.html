<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Express Server</title>
    <link rel="stylesheet" href="style.css">
</head>

<body>
    <nav>
        <a href="/">Home</a>
        <a href="/projects">Projects</a>
        <a href="/guestbook">Guestbook</a>
        <a href="/dashboard">Dashboard</a>
    </nav>
    <h1>Express Server</h1>
    <p>Welcome to the express server</p>

    <div id="status">
        <h2>Welcome!</h2>
    </div>

    <div id="login-section">
        <h2>Login</h2>

        <form id="login-form" action="/login" method="post">
            <label for="password">Password</label>
            <input id="password" name="password" type="password" required>

            <label class="remember-me">
                <input type="checkbox" id="rememberMe" name="rememberMe">
                Remember me
            </label>

            <button type="submit">Log In</button>
        </form>

        <p id="login-message"></p>
    </div>

    <button id="logout-button" type="button" hidden>
        Log Out
    </button>

    <script>
        const loginForm = document.querySelector('#login-form');
        const loginMessage = document.querySelector('#login-message');

        const status = document.querySelector('#status');
        const loginSection = document.querySelector('#login-section');
        const logoutButton = document.querySelector('#logout-button');

        async function checkAuthState() {
            try {
                const response = await fetch('/api/whoami');
                const data = await response.json();

                if (data.loggedIn) {
                    status.innerHTML =
                        '<h1>Welcome back!</h1><a href="/dashboard">Dashboard</a>';

                    loginSection.hidden = true;
                    logoutButton.hidden = false;
                } else {
                    status.innerHTML = '<h1>Welcome!</h1>';
                    loginSection.hidden = false;
                    logoutButton.hidden = true;
                }
            } catch (error) {
                console.error('Auth check failed:', error);

                status.innerHTML = '<h1>Welcome!</h1>';
                loginSection.hidden = false;
                logoutButton.hidden = true;
            }
        }

        loginForm.addEventListener('submit', async (event) => {
            event.preventDefault();

            const password = document.querySelector('#password').value;
            const rememberMe = document.querySelector('#rememberMe').checked;

            try {
                const response = await fetch(loginForm.action, {
                    method: 'POST',
                    headers: {
                        'Content-Type': 'application/json'
                    },
                    body: JSON.stringify({
                        password,
                        rememberMe
                    })
                });

                const data = await response
                    .json()
                    .catch(() => ({ success: false }));

                if (data.success) {
                    loginMessage.textContent = 'Login successful!';
                    loginForm.reset();

                    window.location.href = data.redirect || '/dashboard';
                } else {
                    loginMessage.textContent =
                        data.error || 'Login failed. Please check your password.';
                }
            } catch (error) {
                console.error('Login failed:', error);
                loginMessage.textContent =
                    'Unable to log in. Please try again.';
            }
        });

        logoutButton.addEventListener('click', async () => {
            try {
                const response = await fetch('/logout', {
                    method: 'POST'
                });

                const data = await response
                    .json()
                    .catch(() => ({ success: false }));

                if (data.success) {
                    window.location.href = '/';
                } else {
                    console.error('Logout failed:', data.error);
                }
            } catch (error) {
                console.error('Logout failed:', error);
            }
        });

        checkAuthState();
    </script>
</body>

</html>
